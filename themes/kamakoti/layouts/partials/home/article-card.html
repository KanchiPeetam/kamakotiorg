<div class="swiper-slide">
  <article class="article-card rounded-lg shadow-md overflow-hidden h-full flex flex-col">
    {{ with .Params.featured_image }}
      <div class="article-image">
        <a href="{{ $.RelPermalink }}">
          <img src="{{ . | absURL }}" alt="{{ $.Title }}" class="w-full h-48 object-cover hover:opacity-90 transition-opacity">
        </a>
      </div>
    {{ end }}

    <div class="article-content p-6 flex-grow flex flex-col">
      <h3 class="article-title text-xl font-bold mb-3 flex-grow">
        <a href="{{ $.RelPermalink }}" class="text-gray-900 hover:text-primary-600 transition-colors">
          {{ $.Title }}
        </a>
      </h3>

      <div class="article-meta flex items-center justify-between text-sm text-gray-500">
        <time datetime="{{ $.Date.Format "2006-01-02" }}">
          <i class="far fa-calendar mr-1"></i>
          {{ $.Date.Format "Jan 2, 2006" }}
        </time>

        <a href="{{ $.RelPermalink }}" class="text-primary-600 hover:text-primary-700 font-medium">
          Read More →
        </a>
      </div>
    </div>
  </article>
</div>

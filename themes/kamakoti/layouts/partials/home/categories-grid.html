{{ $categories := .Site.Data.categories.categories }}

{{ if $categories }}
<div class="categories-grid-container">
  <div class="text-center mb-8">
    <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-3">Our Services</h2>
    <p class="text-gray-600 max-w-2xl mx-auto">
      Discover the various initiatives and services offered by Sri Kanchi Kamakoti Peetam
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-8">
    {{ range $categories }}
      {{ partial "home/category-tile.html" . }}
    {{ end }}
  </div>
</div>
{{ end }}

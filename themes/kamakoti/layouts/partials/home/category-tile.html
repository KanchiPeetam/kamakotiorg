{{ $category := . }}

<div class="category-tile group">
  <a href="{{ $category.slug | relURL }}" class="block bg-white rounded-lg shadow-md p-6 h-full transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
    <div class="flex flex-col items-center text-center h-full">
      <!-- Icon -->
      <div class="w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center mb-4 group-hover:bg-primary-600 transition-colors duration-300">
        <i class="fas {{ $category.icon }} text-3xl text-primary-600 group-hover:text-white transition-colors duration-300"></i>
      </div>

      <!-- Title -->
      <h3 class="text-lg font-bold text-gray-900 mb-2 group-hover:text-primary-600 transition-colors duration-300">
        {{ $category.title }}
      </h3>

      <!-- Description -->
      <p class="text-sm text-gray-600 flex-grow">
        {{ $category.description }}
      </p>

      <!-- Arrow -->
      <div class="mt-4 text-primary-600 group-hover:text-primary-700">
        <i class="fas fa-arrow-right"></i>
      </div>
    </div>
  </a>
</div>

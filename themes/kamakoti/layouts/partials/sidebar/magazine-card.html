<!-- Magazine Subscription Card -->
{{ with .Site.Data.sidebar.magazine }}
<div class="sidebar-card bg-gradient-to-br from-primary-50 to-orange-50 rounded-lg shadow-md p-6 border border-primary-100">
  <div class="flex items-start mb-4">
    <div class="flex-shrink-0">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
        <i class="{{ .icon }} text-primary-600 text-xl"></i>
      </div>
    </div>
    <div class="ml-4">
      <h3 class="text-lg font-bold text-gray-900">{{ .title }}</h3>
    </div>
  </div>

  <p class="text-sm text-gray-700 mb-4">{{ .description }}</p>

  {{ if .latest_issue.enabled }}
    <div class="bg-white rounded-lg p-3 mb-4 border border-primary-200">
      <div class="flex items-center text-sm">
        <i class="fas fa-newspaper text-primary-600 mr-2"></i>
        <a href="{{ .latest_issue.link }}" class="text-primary-700 hover:text-primary-800 font-medium">
          {{ .latest_issue.title }}
        </a>
      </div>
    </div>
  {{ end }}

  <a href="{{ .button_link }}" class="btn btn-primary w-full justify-center">
    <i class="fas fa-book-reader mr-2"></i>
    {{ .button_text }}
  </a>
</div>
{{ end }}

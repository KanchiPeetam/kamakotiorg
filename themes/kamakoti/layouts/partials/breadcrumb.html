<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol class="flex items-center text-sm text-gray-600">
    <!-- Home -->
    <li>
      <a href="{{ .Site.BaseURL }}" class="hover:text-primary-600 transition-colors">
        <i class="fas fa-home"></i>
        <span class="sr-only">Home</span>
      </a>
    </li>

    {{ if .Parent }}
      <!-- Parent Section -->
      <li class="flex items-center">
        <i class="fas fa-chevron-right text-xs mx-3 text-gray-400"></i>
        <a href="{{ .Parent.RelPermalink }}" class="hover:text-primary-600 transition-colors">
          {{ .Parent.Title }}
        </a>
      </li>
    {{ end }}

    <!-- Current Page -->
    {{ if not .IsSection }}
      <li class="flex items-center">
        <i class="fas fa-chevron-right text-xs mx-3 text-gray-400"></i>
        <span class="text-gray-900 font-medium" aria-current="page">
          {{ .Title }}
        </span>
      </li>
    {{ end }}
  </ol>
</nav>

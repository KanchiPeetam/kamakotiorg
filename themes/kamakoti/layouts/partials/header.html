<header class="site-header bg-white shadow-sm sticky top-0 z-50">
  <div class="px-4 md:px-6 py-4">
    <div class="flex justify-between items-center">
      <!-- Logo -->
      <div class="logo flex-shrink-0">
        <a href="{{ .Site.BaseURL }}" class="flex items-center">
          {{ if fileExists "static/images/logo.svg" }}
            <img src="{{ "images/logo.svg" | absURL }}" alt="{{ .Site.Title }}" class="h-12 md:h-16">
          {{ else }}
            <span class="text-2xl md:text-3xl font-bold text-primary-600">Kamakoti</span>
          {{ end }}
        </a>
      </div>

      <!-- Navigation Links -->
      <nav class="hidden md:flex items-center space-x-8">
        <a href="/events/" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          <i class="far fa-calendar mr-2"></i>Events
        </a>
        <a href="/announcements/" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          <i class="fas fa-bullhorn mr-2"></i>Announcements
        </a>
        <a href="/gallery/" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          <i class="far fa-images mr-2"></i>Gallery
        </a>
      </nav>

      <!-- Social Media Links -->
      <div class="flex-shrink-0">
        {{ partial "social-links.html" . }}
      </div>
    </div>
  </div>
</header>

<header class="site-header bg-white shadow-sm sticky top-0 z-50">
  <div class="px-4 md:px-6 py-4">
    <div class="flex justify-between items-center">
      <!-- Logo -->
      <div class="logo flex-shrink-0">
        <a href="{{ .Site.BaseURL }}" class="flex items-center">
          {{ if fileExists "static/images/logo.svg" }}
            <img src="{{ "images/logo.svg" | absURL }}" alt="{{ .Site.Title }}" class="h-12 md:h-16">
          {{ else }}
            <span class="text-2xl md:text-3xl font-bold text-primary-600">Kamakoti</span>
          {{ end }}
        </a>
      </div>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center space-x-8">
        <a href="{{ "events" | relURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          <i class="far fa-calendar mr-2"></i>Events
        </a>
        <a href="{{ "announcements" | relURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          <i class="fas fa-bullhorn mr-2"></i>Announcements
        </a>
        <a href="{{ "gallery" | relURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors">
          <i class="far fa-images mr-2"></i>Gallery
        </a>
      </nav>

      <!-- Mobile Menu Button -->
      <button id="mobile-menu-button" class="md:hidden text-gray-700 hover:text-primary-600 focus:outline-none focus:text-primary-600" aria-label="Toggle mobile menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          <path id="close-icon" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <!-- Social Media Links (Desktop) -->
      <div class="hidden md:block flex-shrink-0">
        {{ partial "social-links.html" . }}
      </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <nav id="mobile-menu" class="md:hidden hidden mt-4 pb-4 border-t border-gray-200">
      <div class="flex flex-col space-y-4 mt-4">
        <a href="{{ "events" | relURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors py-2">
          <i class="far fa-calendar mr-2"></i>Events
        </a>
        <a href="{{ "announcements" | relURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors py-2">
          <i class="fas fa-bullhorn mr-2"></i>Announcements
        </a>
        <a href="{{ "gallery" | relURL }}" class="text-gray-700 hover:text-primary-600 font-medium transition-colors py-2">
          <i class="far fa-images mr-2"></i>Gallery
        </a>

        <!-- Social Media Links (Mobile) -->
        <div class="pt-4 border-t border-gray-200">
          {{ partial "social-links.html" . }}
        </div>
      </div>
    </nav>
  </div>
</header>

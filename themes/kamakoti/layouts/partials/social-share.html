{{ $pageURL := .Permalink }}
{{ $pageTitle := .Title }}

<div class="social-share">
  <div class="flex items-center gap-4">
    <h3 class="text-sm font-medium text-gray-700">Share</h3>

    <!-- Facebook -->
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ $pageURL }}"
       target="_blank"
       rel="noopener noreferrer"
       class="w-10 h-10 rounded-full bg-gray-300 hover:bg-primary-600 flex items-center justify-center text-gray-700 hover:text-white transition-all duration-200"
       aria-label="Share on Facebook">
      <i class="fab fa-facebook-f text-base"></i>
    </a>

    <!-- Twitter -->
    <a href="https://twitter.com/intent/tweet?url={{ $pageURL }}&text={{ $pageTitle }}"
       target="_blank"
       rel="noopener noreferrer"
       class="w-10 h-10 rounded-full bg-gray-300 hover:bg-primary-600 flex items-center justify-center text-gray-700 hover:text-white transition-all duration-200"
       aria-label="Share on Twitter">
      <i class="fab fa-twitter text-base"></i>
    </a>

    <!-- WhatsApp -->
    <a href="https://wa.me/?text={{ $pageTitle }}%20{{ $pageURL }}"
       target="_blank"
       rel="noopener noreferrer"
       class="w-10 h-10 rounded-full bg-gray-300 hover:bg-primary-600 flex items-center justify-center text-gray-700 hover:text-white transition-all duration-200"
       aria-label="Share on WhatsApp">
      <i class="fab fa-whatsapp text-base"></i>
    </a>

    <!-- Email -->
    <a href="mailto:?subject={{ $pageTitle }}&body={{ $pageURL }}"
       class="w-10 h-10 rounded-full bg-gray-300 hover:bg-primary-600 flex items-center justify-center text-gray-700 hover:text-white transition-all duration-200"
       aria-label="Share via Email">
      <i class="fas fa-envelope text-base"></i>
    </a>

    <!-- Copy Link -->
    <button type="button"
            onclick="copyToClipboard('{{ $pageURL }}')"
            class="w-10 h-10 rounded-full bg-gray-300 hover:bg-primary-600 flex items-center justify-center text-gray-700 hover:text-white transition-all duration-200"
            aria-label="Copy link to clipboard">
      <i class="fas fa-link text-base"></i>
    </button>
  </div>

  <!-- Copy Success Message -->
  <div id="copy-success" class="hidden mt-3 text-sm text-green-600 flex items-center">
    <i class="fas fa-check-circle mr-2"></i>
    Link copied to clipboard!
  </div>
</div>
